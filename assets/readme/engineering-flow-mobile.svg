<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-labelledby="title desc">
  <title id="title">From context to software</title>
  <desc id="desc">Context flows to models, then tools and software. Animated signal with a static reduced-motion alternative.</desc>
  <style>@media(prefers-reduced-motion:reduce){.motion{display:none}}</style>
  <rect width="400" height="300" rx="12" fill="#0a0a0a"/>
  <path d="M184 77H216M300 126V174M216 223H184" fill="none" stroke="#3e3e48" stroke-width="1.5"/>
  <g fill="#131316" stroke="#33333b">
    <rect x="16" y="28" width="168" height="98" rx="8"/><rect x="216" y="28" width="168" height="98" rx="8"/>
    <rect x="216" y="174" width="168" height="98" rx="8"/><rect x="16" y="174" width="168" height="98" rx="8"/>
  </g>
  <g fill="#f4f4f5" font-family="'Segoe UI',Arial,sans-serif" font-size="23" font-weight="600" text-anchor="middle">
    <text x="100" y="70">Context</text><text x="300" y="70">Models</text><text x="300" y="216">Tools</text><text x="100" y="216">Software</text>
  </g>
  <g fill="#b4b4bc" font-family="'Segoe UI',Arial,sans-serif" font-size="13" text-anchor="middle">
    <text x="100" y="97">Retrieval &amp; knowledge</text><text x="300" y="97">LLMs &amp; reasoning</text><text x="300" y="243">Agents &amp; APIs</text><text x="100" y="243">Interfaces &amp; delivery</text>
  </g>
  <g class="motion" fill="none" stroke="#ff0044" stroke-width="1.5">
    <rect x="16" y="28" width="168" height="98" rx="8" opacity="0"><animate attributeName="opacity" values="0;.85;0;0;0" keyTimes="0;.12;.25;.75;1" dur="8s" repeatCount="indefinite"/></rect>
    <rect x="216" y="28" width="168" height="98" rx="8" opacity="0"><animate attributeName="opacity" values="0;0;.85;0;0" keyTimes="0;.2;.37;.5;1" dur="8s" repeatCount="indefinite"/></rect>
    <rect x="216" y="174" width="168" height="98" rx="8" opacity="0"><animate attributeName="opacity" values="0;0;.85;0;0" keyTimes="0;.45;.62;.75;1" dur="8s" repeatCount="indefinite"/></rect>
    <rect x="16" y="174" width="168" height="98" rx="8" opacity="0"><animate attributeName="opacity" values="0;0;.85;0" keyTimes="0;.7;.87;1" dur="8s" repeatCount="indefinite"/></rect>
  </g>
  <circle class="motion" r="3.5" fill="#ff0044">
    <animateMotion path="M184 77H216M300 126V174M216 223H184" calcMode="linear" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.94;1" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>
