<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-labelledby="title desc">
  <title id="title">From context to software</title>
  <desc id="desc">Context and retrieval connect to language models, tools and APIs, then usable software. A pink signal travels through the workflow.</desc>
  <style>@media(prefers-reduced-motion:reduce){.motion{display:none}}</style>
  <rect width="1000" height="190" rx="12" fill="#0a0a0a"/>
  <g fill="none" stroke="#33333b" stroke-width="1.5">
    <path d="M131 136V158H869V136M377 136V158M623 136V158"/>
  </g>
  <g fill="#131316" stroke="#33333b">
    <rect x="24" y="24" width="214" height="112" rx="8"/>
    <rect x="270" y="24" width="214" height="112" rx="8"/>
    <rect x="516" y="24" width="214" height="112" rx="8"/>
    <rect x="762" y="24" width="214" height="112" rx="8"/>
  </g>
  <g fill="#f4f4f5" font-family="'Segoe UI',Arial,sans-serif" font-size="28" font-weight="600" text-anchor="middle">
    <text x="131" y="73">Context</text><text x="377" y="73">Models</text><text x="623" y="73">Tools</text><text x="869" y="73">Software</text>
  </g>
  <g fill="#b4b4bc" font-family="'Segoe UI',Arial,sans-serif" font-size="17" text-anchor="middle">
    <text x="131" y="105">Retrieval &amp; knowledge</text><text x="377" y="105">LLMs &amp; reasoning</text><text x="623" y="105">Agents &amp; APIs</text><text x="869" y="105">Interfaces &amp; delivery</text>
  </g>
  <g class="motion" fill="none" stroke="#ff0044" stroke-width="1.8">
    <rect x="24" y="24" width="214" height="112" rx="8" opacity="0"><animate attributeName="opacity" values="0;.85;0;0;0" keyTimes="0;.12;.25;.75;1" dur="8s" repeatCount="indefinite"/></rect>
    <rect x="270" y="24" width="214" height="112" rx="8" opacity="0"><animate attributeName="opacity" values="0;0;.85;0;0" keyTimes="0;.2;.37;.5;1" dur="8s" repeatCount="indefinite"/></rect>
    <rect x="516" y="24" width="214" height="112" rx="8" opacity="0"><animate attributeName="opacity" values="0;0;.85;0;0" keyTimes="0;.45;.62;.75;1" dur="8s" repeatCount="indefinite"/></rect>
    <rect x="762" y="24" width="214" height="112" rx="8" opacity="0"><animate attributeName="opacity" values="0;0;.85;0" keyTimes="0;.7;.87;1" dur="8s" repeatCount="indefinite"/></rect>
  </g>
  <circle class="motion" r="4" fill="#ff0044">
    <animateMotion path="M131 136V158H869V136" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.94;1" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>
